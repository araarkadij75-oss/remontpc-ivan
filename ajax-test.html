(async()=>{
 try{
  const r=await fetch('https://formsubmit.co/ajax/araarkadij75@gmail.com',{
   method:'POST',

   body:JSON.stringify({

    name:'ТЕСТ Чинилкин AJAX',
    phone:'+7 999 000-00-03',

 }catch(e){document.getElementById('out').textContent='ERROR '+e;}
})();
</script></body></html>
